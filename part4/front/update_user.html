<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update user - BlockBnB</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <img src="images/Logo.png" alt="BlockBnB logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main>
        <form id="update_the_user">
            <h2>Update your profil</h2>
            <label for="first_name">First name</label>
            <input type="first_name" name="first_name" id="first_name" required>
            
            <label for="last_name">Last name</label>
            <input type="last_name" name="last_name" id="last_name" required>
            
            <button type="button" id="update_user_button">Update</button>
        </form>
    </main>

    <footer>
        <p>© 2025 BlockBnB - All Rights Reserved</p>
    </footer>
    
    <script src="js/scripts.js"></script>
</body>
</html>
