<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BlockBnB</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <img src="images/Logo.png" alt="BlockBnB logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main>
        <form id="create_user">
            <h2>Create Your Account</h2>
            <label for="first_name">First name</label>
            <input type="first_name" name="first_name" id="first_name" required>
            
            <label for="last_name">Last name</label>
            <input type="last_name" name="last_name" id="last_name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="button" id="create_user_button">Create user</button>
        </form>
    </main>

    <footer>
        <p>© 2025 BlockBnB - All Rights Reserved</p>
    </footer>
    
    <script src="js/scripts.js"></script>
</body>
</html>
